<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接拾知</title><link rel="stylesheet" href="/style.css"><script src="/lan-login.js" defer></script></head><body class="lan-login-page"><main class="lan-login-shell"><a class="brand" href="/">拾<span>知</span><small>保研学习助手</small></a><section class="panel"><div class="eyebrow">你的学习空间，换个屏幕继续</div><h1>连接电脑上的拾知</h1><p>请在电脑的“手机访问启动”窗口查看临时访问码。</p><form id="lanLoginForm"><label class="label" for="lanCode">手机访问码</label><input id="lanCode" type="password" autocomplete="off" maxlength="128" required placeholder="输入电脑窗口显示的访问码"><p class="muted">这是手机访问码，不是 DeepSeek API Key。</p><button class="button primary" type="submit" id="lanConnect">连接学习空间</button><p id="lanError" role="alert"></p></form></section><p class="muted">资料与进度保存在电脑，电脑需要保持开机。仅用于同一可信 Wi-Fi。</p></main></body></html>
