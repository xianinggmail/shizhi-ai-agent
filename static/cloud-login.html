<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接拾知</title><link rel="stylesheet" href="/style.css"><script src="/lan-login.js" defer></script></head><body class="lan-login-page"><main class="lan-login-shell"><a class="brand" href="/">拾<span>知</span><small>保研学习助手</small></a><section class="panel"><div class="eyebrow">你的学习空间，换个屏幕继续</div><h1>进入拾知体验空间</h1><p>请输入项目提供者发给你的邀请访问码。</p><form id="lanLoginForm"><label class="label" for="lanCode">邀请访问码</label><input id="lanCode" type="password" autocomplete="off" maxlength="128" required placeholder="输入收到的邀请访问码"><p class="muted">这是邀请访问码，不是 DeepSeek API Key。</p><button class="button primary" type="submit" id="lanConnect">连接学习空间</button><p id="lanError" role="alert"></p></form></section><p class="muted">这是受邀者共用的云端体验空间，资料与学习记录相互可见。请仅上传可共享的测试材料。</p></main></body></html>
